[package]
name = "guardian"
version = "0.1.0"
description = "On-chain safety gate for the Solana AI Trading System."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "guardian"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
