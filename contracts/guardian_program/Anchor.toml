[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
guardian = "DVQ3uopMVLznw3tLJahTkfE1VwzNSPHo1Q8tTvUbjdrG"

[programs.devnet]
guardian = "DVQ3uopMVLznw3tLJahTkfE1VwzNSPHo1Q8tTvUbjdrG"

# Both Program IDs above are placeholders. They are overwritten the first time
# `anchor build` runs (the Anchor build step calls `solana-keygen new` for the
# program keypair at target/deploy/guardian-keypair.json and rewrites these
# entries with the matching Program ID). Until then they keep the file valid.

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
url = "https://api.devnet.solana.com"

[[test.validator.clone]]
address = "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"   # SPL Token program — cloned for tests that touch SPL
